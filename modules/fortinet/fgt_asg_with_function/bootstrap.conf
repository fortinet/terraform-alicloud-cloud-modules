Content-Type: multipart/mixed; boundary="==ALICLOUD=="
MIME-Version: 1.0

--==ALICLOUD==
Content-Type: text/x-shellscript; charset="us-ascii"
MIME-Version: 1.0

%{ if hostname != "" ~}
config system global
    set hostname ${hostname}
end
%{ endif ~}
config system interface
    edit "port1"
        set allowaccess ping https ssh probe-response
    next
end
config system fortiguard
    set interface-select-method specify
    set interface "port1"
end
config system dns
    set interface-select-method specify
    set interface "port1"
end
%{ if length(port1_routes) > 0 ~}
config router static
%{ for route in port1_routes ~}
    edit 0
        set dst ${route.network} ${route.netmask}
        set device port1
        set dynamic-gateway enable
    next
%{ endfor ~}
end
%{ endif ~}
config firewall service custom
    edit "ProbeService"
        set tcp-portrange ${health_check_port}
    next
end
config system probe-response
    set mode http-probe
    set port ${health_check_port}
end
config system settings
    set auxiliary-session enable
end
${config_script}
--==ALICLOUD==--
