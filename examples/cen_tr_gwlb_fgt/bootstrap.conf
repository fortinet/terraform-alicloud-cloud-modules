config system geneve
%{ for tunnel in gwlb_tunnels ~}
    edit "${tunnel.name}"
        set interface port1
        set type ppp
        set remote-ip ${tunnel.remote_ip}
    next
%{ endfor ~}
end
config system zone
    edit "gwlb-inspection"
        set interface ${join(" ", formatlist("\"%s\"", [for tunnel in gwlb_tunnels : tunnel.name]))}
    next
end
config router static
    edit 0
        set dst 0.0.0.0 0.0.0.0
        set device port1
        set dynamic-gateway enable
        set distance 5
        set priority 1
    next
%{ for tunnel in gwlb_tunnels ~}
    edit 0
        set dst ${tunnel.remote_ip} 255.255.255.255
        set device port1
        set dynamic-gateway enable
    next
    edit 0
        set distance 5
        set priority 100
        set device "${tunnel.name}"
    next
%{ endfor ~}
end
config router policy
%{ for tunnel in gwlb_tunnels ~}
    edit 0
        set input-device "${tunnel.name}"
        set src "0.0.0.0/0.0.0.0"
        set dst "0.0.0.0/0.0.0.0"
        set output-device "${tunnel.name}"
    next
%{ endfor ~}
end
${config_script}
